version: 2

project_name: apifox-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: apifox-cli
    main: ./cmd/apifox-cli
    binary: apifox-cli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/iwen-conf/apifox-mcp/internal/apifoxcli.version={{ .Version }} -X github.com/iwen-conf/apifox-mcp/internal/apifoxcli.commit={{ .Commit }} -X github.com/iwen-conf/apifox-mcp/internal/apifoxcli.date={{ .Date }}

archives:
  - id: apifox-cli
    ids:
      - apifox-cli
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  github:
    owner: iwen-conf
    name: apifox-mcp

homebrew_casks:
  - name: apifox-cli
    ids:
      - apifox-cli
    repository:
      owner: iwen-conf
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/iwen-conf/apifox-mcp
    description: "Go CLI for AI-authored Apifox/OpenAPI documentation"
    license: MIT
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
              args: ["-d", "com.apple.quarantine", "#{staged_path}/apifox-cli"],
              sudo: false,
              must_succeed: false
          end
    binaries:
      - apifox-cli
