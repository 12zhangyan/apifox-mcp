[project]
name = "apifox-cli"
version = "0.2.0"
description = "Enterprise MCP server and Go CLI for managing Apifox/OpenAPI documentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Apifox CLI Contributors" }
]
keywords = ["apifox", "api", "openapi", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp[cli]>=2.0.0,<3",
]

[project.scripts]
apifox-mcp = "apifox_mcp.main:main"

[project.urls]
Homepage = "https://github.com/iwen-conf/apifox-mcp"
Repository = "https://github.com/iwen-conf/apifox-mcp"
Issues = "https://github.com/iwen-conf/apifox-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.14,<7",
    "pytest>=8.4,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["apifox_mcp"]

[tool.hatch.build.hooks.custom]
